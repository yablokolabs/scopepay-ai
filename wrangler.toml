# ScopePay on Cloudflare Workers: the Hono API plus the built client, with D1 storage.
# Secrets are set with `wrangler secret put` and never live in this file.
name = "scopepay"
main = "worker/index.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./dist"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/health"]

[[d1_databases]]
binding = "DB"
database_name = "scopepay"
database_id = "7fa7a710-1afb-4077-8cb6-1b30c1dc01b7"
migrations_dir = "migrations"

# 10 model calls (brief extraction or change classification) per caller per minute.
[[ratelimits]]
name = "MODEL_RATE_LIMIT"
namespace_id = "1001"
simple = { limit = 10, period = 60 }
